<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0C0B0A; color: white; margin: 0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="p-6 space-y-12">
  <h1 class="text-2xl font-bold">Hero Video Layout Options</h1>

  <!-- Option 1: Full width edge-to-edge container, h-[80vh], object-cover -->
  <div>
    <h2 class="text-lg font-semibold text-amber-400 mb-2">Option 1: Full Width Edge-to-Edge (h-[75vh], object-cover, object-[center_20%])</h2>
    <div class="relative w-full h-[75vh] max-h-[750px] rounded-2xl overflow-hidden border border-white/10 bg-black">
      <video src="/assets/videos/bridal-hero.mp4" autoplay loop muted playsinline class="w-full h-full object-cover object-[center_25%]"></video>
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30 pointer-events-none"></div>
    </div>
  </div>

  <!-- Option 2: Luxury Cinematic Center with ambient blurred video background -->
  <div>
    <h2 class="text-lg font-semibold text-amber-400 mb-2">Option 2: Luxury Theater (Full bleed ambient glow + centered 9:16 / 4:5 hero reel)</h2>
    <div class="relative w-full h-[85vh] max-h-[820px] rounded-2xl overflow-hidden border border-white/10 bg-[#0A0908] flex items-center justify-center">
      <!-- Ambient video blur -->
      <video src="/assets/videos/bridal-hero.mp4" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover filter blur-3xl opacity-35 scale-110 pointer-events-none"></video>
      <div class="absolute inset-0 bg-black/40"></div>
      <!-- Crisp main video -->
      <div class="relative h-[92%] aspect-[9/16] rounded-2xl overflow-hidden shadow-[0_20px_60px_rgba(0,0,0,0.9)] border border-white/20 z-10">
        <video src="/assets/videos/bridal-hero.mp4" autoplay loop muted playsinline class="w-full h-full object-cover"></video>
      </div>
    </div>
  </div>

  <!-- Option 3: Full Width Container with max-w-6xl centered cinema -->
  <div>
    <h2 class="text-lg font-semibold text-amber-400 mb-2">Option 3: Max-Width Luxury Frame (max-w-6xl mx-auto, h-[80vh])</h2>
    <div class="max-w-6xl mx-auto relative h-[80vh] max-h-[750px] rounded-3xl overflow-hidden border border-white/15 bg-black shadow-2xl">
      <video src="/assets/videos/bridal-hero.mp4" autoplay loop muted playsinline class="w-full h-full object-cover object-[center_30%]"></video>
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-black/30 pointer-events-none"></div>
    </div>
  </div>
</body>
</html>
